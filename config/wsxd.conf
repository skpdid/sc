server {
    listen 127.0.0.1:10100 proxy_protocol so_keepalive=on reuseport;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name xxx;

    # Tuning Buffer & Timeout
    client_body_buffer_size 512K;
    client_header_buffer_size 16k;
    client_max_body_size 4M;
    large_client_header_buffers 2 32k;
    client_header_timeout 1s;
    keepalive_timeout 1s;

    # Security Headers
    add_header X-HTTP-LEVEL-HEADER 1;
    add_header X-ANOTHER-HTTP-LEVEL-HEADER 1;
    add_header X-XSS-Protection "1; mode=block";

    # --- 1. Websocket ---
    location ~ /vless {
        proxy_pass http://127.0.0.1:20001;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /vmess {
        proxy_pass http://127.0.0.1:20002;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /trojan {
        proxy_pass http://127.0.0.1:20003;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /shadowsocks {
        proxy_pass http://127.0.0.1:20004;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ / {
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 127.0.0.1:10200 http2 proxy_protocol so_keepalive=on reuseport;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name xxx;

    # Tuning Buffer & Timeout
    client_body_buffer_size 512K;
    client_header_buffer_size 16k;
    client_max_body_size 4M;
    large_client_header_buffers 2 32k;
    client_header_timeout 1s;
    keepalive_timeout 1s;

    # Security Headers
    add_header X-HTTP-LEVEL-HEADER 1;
    add_header X-ANOTHER-HTTP-LEVEL-HEADER 1;

    # --- 2. gRPC ---
    location ~ /(vless-grpc|vless/Tun) {
        grpc_pass grpc://127.0.0.1:20005;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /(vmess-grpc|vmess/Tun) {
        grpc_pass grpc://127.0.0.1:20006;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /(trojan-grpc|trojan/Tun) {
        grpc_pass grpc://127.0.0.1:20007;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /(shadowsocks-grpc|shadowsocks/Tun) {
        grpc_pass grpc://127.0.0.1:20008;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}

server {
    listen 81 ssl http2 reuseport;
    ssl_certificate /etc/xray/xray.crt;
    ssl_certificate_key /etc/xray/xray.key;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+ECDSA+AES128:EECDH+aRSA+AES128:RSA+AES128:EECDH+ECDSA+AES256:EECDH+aRSA+AES256:RSA+AES256:EECDH+ECDSA+3DES:EECDH+aRSA+3DES:RSA+3DES:!MD5;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    root /var/www/html;
}


server {
    listen 5000 ssl http2 reuseport;
    server_name 127.0.0.1 localhost;
    
    ssl_certificate /etc/xray/xray.crt;
    ssl_certificate_key /etc/xray/xray.key;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+ECDSA+AES128:EECDH+aRSA+AES128:RSA+AES128:EECDH+ECDSA+AES256:EECDH+aRSA+AES256:RSA+AES256:EECDH+ECDSA+3DES:EECDH+aRSA+3DES:RSA+3DES:!MD5;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    
    root /var/www/html;
    
    autoindex off;
    
    location / {
        add_header Content-Disposition 'attachment';
        try_files $uri =404;
    }
}
